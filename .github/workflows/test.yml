name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Validate, test, and lint (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skill helpers need Node.js 22.18+ type stripping; 24 is the current LTS.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Validate the skill package
        run: npm run validate
      - run: npm test
      - run: npm run lint

  references:
    name: Reference extracts in sync (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The generator supports Python 3.9+ with the standard library only.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check generated references against the paper
        run: python3 skills/compass-prompt-framework/scripts/generate-references.py --check

  commits:
    name: Commit messages follow the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check commit messages
        # Dependabot writes its own messages and cannot add the required trailers.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TRAILER: "Co-Authored-By: Claude Code <noreply@anthropic.com>"
        run: |
          # A new branch or manual run has no base; check only the head commit.
          if [ -z "${BASE//0/}" ]; then
            commits="$HEAD"
          else
            commits=$(git rev-list --no-merges "$BASE..$HEAD")
          fi
          status=0
          for sha in $commits; do
            # Merged Dependabot pull requests reach main with Dependabot as author.
            if [ "$(git log -1 --format=%an "$sha")" = "dependabot[bot]" ]; then
              continue
            fi
            echo "$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" | python3 .github/scripts/lint-commit.py --trailer "$TRAILER" - || status=1
          done
          exit $status
